<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16152b">
  <title>Visual Novel Demo</title>
  <style>
    :root {
      font-family: "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
      color: #fff;
      background: transparent;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: transparent;
    }

    .game {
      position: relative;
      width: min(100%, 960px);
      overflow: hidden;
    }

    .game.is-collapsed {
      width: min(100%, 960px);
      overflow: visible;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 4038 / 2480;
      overflow: hidden;
      isolation: isolate;
    }

    .map-background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game.is-collapsed .dialogue {
      display: none;
    }

    .chat-launcher {
      display: none;
      width: 112px;
      height: 112px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }

    .game.is-collapsed .chat-launcher {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 10;
      display: grid;
      place-items: center;
    }

    .chat-launcher img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px #0008);
    }

    .character {
      position: absolute;
      bottom: -3%;
      left: 4%;
      width: min(61%, 390px);
      height: 94%;
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 12px 18px #11182766);
      animation: appear 550ms ease-out both;
      z-index: 1;
    }

    .game.is-intro-complete .character {
      display: none;
    }

    .game.is-showing-location .character {
      display: block;
    }

    .game.is-chatting .character {
      display: block;
    }

    .map-location {
      position: absolute;
      z-index: 2;
      min-height: 0;
      padding: 0;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
    }

    .map-location:hover {
      border-color: #ffe08a;
      background: #ffe08a24;
    }

    .map-location:disabled {
      pointer-events: none;
    }

    .map-location:focus-visible {
      border-color: #ffe08a;
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    .map-location.church {
      left: 4%;
      top: 13%;
      width: 19%;
      height: 32%;
    }

    .map-location.castle {
      left: 33%;
      top: 7%;
      width: 24%;
      height: 43%;
    }

    .map-location.house {
      left: 59%;
      top: 5%;
      width: 19%;
      height: 33%;
    }

    .map-location.farm {
      left: 66%;
      top: 30%;
      width: 20%;
      height: 24%;
    }

    .map-location.tavern-west {
      left: 5%;
      top: 48%;
      width: 17%;
      height: 31%;
    }

    .map-location.restaurant {
      left: 21%;
      top: 47%;
      width: 16%;
      height: 26%;
    }

    .map-location.knight {
      left: 48%;
      top: 46%;
      width: 22%;
      height: 24%;
    }

    .map-location.tavern-east {
      left: 80%;
      top: 39%;
      width: 19%;
      height: 31%;
    }

    .map-location.guild {
      left: 47%;
      top: 66%;
      width: 24%;
      height: 32%;
    }

    .map-hint {
      position: absolute;
      z-index: 3;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border: 1px solid #ffffff66;
      border-radius: 999px;
      background: #171629d9;
      color: #fff;
      font-size: 0.8rem;
      pointer-events: none;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .dialogue {
      position: absolute;
      right: 18px;
      bottom: 18px;
      left: 18px;
      z-index: 4;
      cursor: pointer;
      margin: 0;
      padding: 22px 24px 18px;
      border: 1px solid #ffffff45;
      border-radius: 14px;
      background: linear-gradient(135deg, #211d3bed, #171629f5);
      box-shadow: 0 12px 28px #08081470;
    }

    .speaker {
      position: absolute;
      top: -17px;
      left: 22px;
      padding: 5px 16px;
      border: 1px solid #ffffff55;
      border-radius: 999px;
      background: #a76eaa;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .line {
      min-height: 3.2em;
      margin: 3px 0 15px;
      color: #fff;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      line-height: 1.8;
      white-space: pre-line;
    }

    .controls {
      display: flex;
    }

    .hint {
      color: #c9c4df;
      font-size: 0.82rem;
    }

    button {
      min-height: 42px;
      padding: 9px 18px;
      border: 1px solid #ffffff4a;
      border-radius: 10px;
      color: #fff;
      font: inherit;
      cursor: pointer;
      transition: transform 140ms ease, background 140ms ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #f7d8ff;
      outline-offset: 3px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 14px;
    }

    .choice {
      flex: 1 1 210px;
      background: #383253;
      text-align: left;
    }

    .choice:hover {
      background: #51466f;
    }

    @media (max-width: 560px) {
      body {
        padding: 10px;
      }

      .stage {
        width: 100%;
      }

      .character {
        left: 2%;
        width: 42%;
        height: 55%;
      }

      .map-hint {
        top: 6px;
        font-size: 0.68rem;
      }

      .dialogue {
        right: 10px;
        bottom: 10px;
        left: 10px;
        padding: 22px 16px 15px;
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="game" aria-label="ตัวอย่างเกม Visual Novel">
    <section class="stage" aria-label="แผนที่เมือง Dead Garden">
      <img class="map-background" src="Character/Map.PNG" alt="แผนที่เมือง Dead Garden">
      <img class="character" src="Character/Elverlin.PNG" alt="ตัวละคร Elverlin">
      <span class="map-hint">กดเลือกสถานที่บนแผนที่เพื่อฟังเอลเวอร์ลินอธิบาย</span>
      <button class="map-location church" type="button" aria-label="ฟังคำอธิบายโบสถ์" disabled></button>
      <button class="map-location castle" type="button" aria-label="ฟังคำอธิบายปราสาท" disabled></button>
      <button class="map-location house" type="button" aria-label="ฟังคำอธิบายบ้านขาย" disabled></button>
      <button class="map-location farm" type="button" aria-label="ฟังคำอธิบายฟาร์ม" disabled></button>
      <button class="map-location tavern-west" type="button" aria-label="ฟังคำอธิบายโรงเตี๊ยมฝั่งตะวันตก"
        disabled></button>
      <button class="map-location restaurant" type="button" aria-label="ฟังคำอธิบายร้านอาหาร" disabled></button>
      <button class="map-location knight" type="button" aria-label="ฟังคำอธิบายอัศวินแห่ง Dead Garden"
        disabled></button>
      <button class="map-location tavern-east" type="button" aria-label="ฟังคำอธิบายโรงเตี๊ยมฝั่งตะวันออก"
        disabled></button>
      <button class="map-location guild" type="button" aria-label="ฟังคำอธิบายกิลด์นักผจญภัย" disabled></button>
    </section>
    <section class="dialogue" aria-live="polite" tabindex="-1">
      <div class="speaker" id="speaker">เอลเวอร์ลิน</div>
      <p class="line" id="line"></p>
      <div class="choices" id="choices" hidden></div>
      <div class="controls">
        <span class="hint">คลิกที่หน้าจอเพื่อไปต่อ</span>
      </div>
    </section>
    <button class="chat-launcher" id="chat-launcher" type="button" aria-label="เปิดบทสนทนากับเอลเวอร์ลิน"
      title="คุยกับเอลเวอร์ลิน">
      <img src="Character/Elverlinicon.PNG" alt="">
    </button>
  </main>
  <script>
    const introScenes = [
      { speaker: "เอลเวอร์ลิน", text: "อ๊ะ!? นี่น่ะคือแผนที่ของเมืองนี้ยังไงล่ะ...ฉันทำเองน่ะ\nจริงสิ เมืองนี้มีชื่อว่า Dead Garden" },
      { speaker: "เอลเวอร์ลิน", text: "...มันถูกเรียกแบบนั้นน่ะ" },
      {
        speaker: "เอลเวอร์ลิน",
        text: "เป็นไงบ้างพอดูรู้เรื่องมั้ย?",
        choices: [
          { label: "แล้วที่มันมีอะไรบ้างล่ะเนี่ย?", reply: "อยากรู้ตรงไหนล่ะ? ลองชี้ได้เลยนะ" },
          { label: "อื้ม! เข้าใจแล้วล่ะ", reply: "อื้ม! ถ้าสงสัยอะไรตรงไหนก็ชี้ได้เลยนะ!" }
        ]
      }
    ];

    const chatScenes = [
      {
        speaker: "เอลเวอร์ลิน", text: "หืม? อะไรๆ มีอะไรงั้นหรอ?",
        choices: [
          {
            label: "คือว่า เธอชอบกินอะไรงั้นหรอ?",
            reply: "เอ๋-- ก็...ขนมปังกับเนื้อสไลม์เปรี๊ยวหวานล่ะมั้ง",
            followUp: {
              speaker: "เอลเวอร์ลิน",
              text: "เอ๋-- ก็...ขนมปังกับเนื้อสไลม์เปรี๊ยวหวานล่ะมั้ง",
              choices: [
                {
                  label: "เมนูแปลกดีนะ", reply: "ไม่แปลกสักหน่อย!",
                  followUp: {
                    speaker: "เอลเวอร์ลิน", text: "แล้วเธอล่ะชอบกินอะไร!",
                    choices: [
                      { label: "ไก่สี่ปีกย่างเสียบไม้!", reply: "ชิ..." },
                      { label: "สลัดแดนเพลิง", reply: "ชิ..." },
                      { label: "เนื้อมังกรดินติดมัน", reply: "ชิ..." }]
                  }
                },
                {
                  label: "อ่อ ไม่เคยลองเลยแหะ", reply: "ถ้ามีโอกาส ไว้ไปกินด้วยกันนะ!",
                  followUp: {
                    speaker: "เอลเวอร์ลิน",
                    text: "ถ้ามีโอกาส ไว้ไปกินด้วยกันนะ!",
                    choices: [
                      { label: "ได้สิ", reply: "จัดไป!" },
                      { label: "ถ้ามีโอกาสล่ะนะ", reply: "เดี๋ยวก็ได้รู้กัน จะทำให้กินไม่ไหวเลยคอยดู" }
                    ]
                  }
                },

              ]
            }
          }
          , {
            label: "ในกระเป๋านั่นอะไรน่ะ?",
            reply: "อ๋อ ก็เสบียงไงล่ะ ส่วนใหญ่เป็นอาหารที่เก็บได้นานน่ะ",
            followUp: {
              speaker: "เอลเวอร์ลิน",
              text: "เพราะว่าต้องเดินทางไกลตลอดน่ะนะ เลยต้องมีติดตัวไว้บ้าง",
              choices: [
                { label: "เป็นงั้นเองหรอ", reply: "อื้ม! กองทัพต้องเดินด้วยท้องไงล่ะ!" },
                { label: "เดินทางไกลหรอ?", reply: "ก็แค่ไปสำรวจนู่นนี่น่ะนะ" }
              ]
            }
          },
          { label: "ไม่มีอะไร", close: true }
        ]
      }
    ]

    const mapLocations = [
      { selector: ".church", text: "ตรงนั้นคือโบสถ์ยังไงล่ะ! เป็นที่พักใจของคนในเมือง และก็มีนักบวชคอยช่วยเหลือคนที่เดือดร้อนด้วยนะจะบอกให้" },
      { selector: ".castle", text: "นั่นคือปราสาทแกรนด์ เป็นที่พำนักของผู้ปกครองเมืองและเป็นศูนย์กลางการดูแล Dead Garden" },
      { selector: ".house", name: "บ้านขาย", text: "บ้านหลังนั้น...ฉันว่าจะหาเงินมาซื้ออยู่เลยวาดลงไปด้วย ไม่มีอะไรหรอก" },
      { selector: ".farm", name: "ฟาร์ม", text: "ตรงนั้นเป็นฟาร์มล่ะ แต่จะเลี้ยงสัตว์เป็นส่วนใหญ่...ก็นะ สภาพนี้มันปลูกพืชอะไรยากย๊าก" },
      { selector: ".tavern-west", name: "โรงเตี๊ยมฝั่งตะวันตก", text: "โรงเตี๊ยมทางฝั่งตะวันตกเป็นที่พักของนักเดินทาง จะแวะพัก แวะกินข้าว หรือฟังข่าวสารอะไรจากคนในนั้นเพื่อได้อะไรดีๆกลับมาบ้าง" },
      { selector: ".restaurant", name: "ร้านอาหาร", text: "ร้านอาหารตรงนั้นอร่อยเอาเรื่อง ขนาดเมนูธรรมดาอย่าง ขนมปังเนื้อสไลม์เปรี๊ยวหนาว ยังทำฉันติดใจได้เลยนะขอบอก" },
      { selector: ".knight", name: "อัศวินแห่ง Dead Garden", text: "บริเวณนี้เป็นที่ประจำการของกองอัศวินแห่ง Dead Garden พวกเขาคอยดูแลความปลอดภัยและช่วยปกป้องเมืองนี้น่ะ" },
      { selector: ".tavern-east", name: "โรงเตี๊ยมฝั่งตะวันออก", text: "โรงเตี๊ยมทางตะวันออก แพงกว่าทางฝั่งตะวันตกนิดหน่อย แต่ยังน้อยที่นอนก็ดี แถมมีอาหารเช้าฟรีให้ด้วย" },
      { selector: ".guild", name: "กิลด์นักผจญภัย", text: "นั่นคือกิลด์นักผจญภัย ส่วนใหญ่ฉันใช้เวลาอยู่ที่นั่นแหละ ภารกิจส่วนที่ฉันรับจะเป็นการสำรวจ แต่มีอย่างอื่นด้วยจะลองไปดูก็ได้นะ" }
    ];

    let activeScenes = introScenes;
    const speaker = document.getElementById("speaker");
    const line = document.getElementById("line");
    const choices = document.getElementById("choices");
    const game = document.querySelector(".game");
    const dialogue = document.querySelector(".dialogue");
    const chatLauncher = document.getElementById("chat-launcher");
    let sceneIndex = 0;
    let chosenReply = "";
    let pendingFollowUp = null;
    let pausedConversation = null;
    let showingMapLocation = false;
    let introCompleted = false;

    function renderScene() {
      const scene = activeScenes[sceneIndex];
      speaker.textContent = scene.speaker;
      line.textContent = chosenReply || scene.text;
      choices.replaceChildren();
      choices.hidden = !scene.choices || Boolean(chosenReply);

      if (scene.choices && !chosenReply) {
        scene.choices.forEach((choice) => {
          const button = document.createElement("button");
          button.className = "choice";
          button.type = "button";
          button.textContent = choice.label;
          button.addEventListener("click", () => {
            if (choice.close) {
              closeConversation();
              return;
            }
            chosenReply = choice.reply;
            pendingFollowUp = choice.followUp || null;
            renderScene();
          });
          choices.append(button);
        });
      }

    }

    function closeConversation() {
      introCompleted = true;
      game.classList.add("is-intro-complete");
      game.classList.remove("is-showing-location", "is-chatting");
      document.querySelectorAll(".map-location").forEach((button) => {
        button.disabled = false;
      });
      pausedConversation = null;
      showingMapLocation = false;
      game.classList.add("is-collapsed");
      chatLauncher.focus();
    }

    function advance() {
      if (choices.hidden === false) return;
      if (showingMapLocation) {
        const returnToMap = pausedConversation.wasCollapsed;
        activeScenes = pausedConversation.activeScenes;
        sceneIndex = pausedConversation.sceneIndex;
        chosenReply = pausedConversation.chosenReply;
        pendingFollowUp = pausedConversation.pendingFollowUp;
        pausedConversation = null;
        showingMapLocation = false;
        game.classList.remove("is-showing-location");
        renderScene();
        if (returnToMap) {
          game.classList.add("is-collapsed");
          chatLauncher.focus();
        }
        return;
      }
      if (pendingFollowUp) {
        activeScenes = [pendingFollowUp];
        sceneIndex = 0;
        chosenReply = "";
        pendingFollowUp = null;
        renderScene();
        return;
      }
      if (sceneIndex === activeScenes.length - 1) {
        closeConversation();
        return;
      }
      sceneIndex += 1;
      chosenReply = "";
      renderScene();
    }

    chatLauncher.addEventListener("click", () => {
      activeScenes = introCompleted ? chatScenes : introScenes;
      sceneIndex = 0;
      chosenReply = "";
      pendingFollowUp = null;
      renderScene();
      game.classList.remove("is-collapsed");
      game.classList.remove("is-showing-location");
      if (introCompleted) game.classList.add("is-chatting");
      dialogue.focus();
    });

    mapLocations.forEach((location) => {
      document.querySelector(location.selector).addEventListener("click", (event) => {
        event.stopPropagation();
        if (!introCompleted) return;
        if (!showingMapLocation) {
          pausedConversation = {
            activeScenes,
            sceneIndex,
            chosenReply,
            pendingFollowUp,
            wasCollapsed: game.classList.contains("is-collapsed")
          };
        }
        activeScenes = [{ speaker: "เอลเวอร์ลิน", text: location.text }];
        sceneIndex = 0;
        chosenReply = "";
        pendingFollowUp = null;
        showingMapLocation = true;
        game.classList.remove("is-collapsed");
        game.classList.add("is-showing-location");
        renderScene();
      });
    });

    game.addEventListener("click", (event) => {
      if (event.target.closest("button")) return;
      if (game.classList.contains("is-collapsed") && !showingMapLocation) return;
      advance();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        if (document.activeElement?.tagName === "BUTTON") return;
        event.preventDefault();
        advance();
      }
    });

    renderScene();
  </script>
</body>

</html>
